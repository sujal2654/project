<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujal - Project Showcase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --accent-color: #06b6d4;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--text-primary);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            align-items: center;
        }

        .profile-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
            opacity: 0;
        }

        .profile-card:hover::before {
            animation: shimmer 0.5s ease-in-out;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
                opacity: 0;
            }
        }

        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .info-item {
            padding: 1rem;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            background: rgba(99, 102, 241, 0.1);
            transform: scale(1.02);
        }

        .info-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .info-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        .projects-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            width: 100%;
            margin-top: 1rem;
        }

        .project-button {
            background: var(--card-bg);
            border: none;
            border-radius: 15px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            position: relative;
            overflow: hidden;
        }

        .project-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .project-button:hover::after {
            opacity: 0.1;
        }

        .project-button:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: var(--shadow-hover);
        }

        .project-button:active {
            transform: translateY(-2px) scale(0.98);
        }

        .project-icon {
            font-size: 3rem;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .project-button:hover .project-icon {
            transform: scale(1.2) rotate(10deg);
        }

        .project-title {
            font-size: 1.25rem;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .navigation {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .nav-button {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: var(--card-bg);
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-button:hover:not(:disabled) {
            transform: scale(1.1);
            box-shadow: var(--shadow-hover);
        }

        .nav-button:active:not(:disabled) {
            transform: scale(0.95);
        }

        .nav-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .nav-button::before {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            background: var(--primary-color);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .nav-button:hover:not(:disabled)::before {
            width: 100%;
            height: 100%;
            opacity: 0.2;
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.875rem;
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            .profile-card {
                padding: 2rem;
            }

            h1 {
                font-size: 2rem;
            }

            .projects-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <div class="avatar">👨‍💻</div>
            <h1>Sujal</h1>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Class</div>
                    <div class="info-value">BCA 5th Semester</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Roll Number</div>
                    <div class="info-value">2319585</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Institute</div>
                    <div class="info-value">CT Group of Institutions, Shahpur</div>
                </div>
            </div>
        </div>

        <div class="projects-container">
            <!-- Button for Password Strength Tester -->
<button class="project-button" onclick="window.location.href='password.html'">
    <div class="project-icon">🔐</div>
    <div class="project-title">Password Strength Tester</div>
</button>

<!-- Button for DDoS Attack Simulation -->
<button class="project-button" onclick="window.location.href='ddos.html'">
    <div class="project-icon">🌐</div>
    <div class="project-title">DDoS Attack Simulation</div>
</button>

        </div>

        <div class="navigation">
            <button class="nav-button" onclick="handleNavigation('prev')" title="Previous page">◀</button>
            <button class="nav-button" onclick="handleNavigation('next')" title="Next page">▶</button>
        </div>

        <div class="footer">
            © 2025 Sujal. All rights reserved.
        </div>
    </div>

    <script>
        function handleProjectClick(project) {
            const button = event.target.closest('.project-button');
            button.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                button.style.transform = '';
                if (project === 'password-tester') {
                    alert('🔐 Password Strength Tester - Check how strong your passwords are!');
                    // In real implementation: window.location.href = 'password-tester.html';
                } else {
                    alert('🌐 DDoS Attack Simulation - Learn about DDoS attacks in a safe environment');
                    // In real implementation: window.location.href = 'ddos-simulation.html';
                }
            }, 150);
        }

        function handleNavigation(direction) {
            const button = event.target;
            button.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                button.style.transform = '';
                if (direction === 'prev') {
                    alert('This is the first page');
                } else {
                    alert('🚀 Navigating to next page...');
                    // In real implementation: window.location.href = 'password-generator.html';
                }
            }, 150);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.animation = 'fadeIn 0.6s ease-out forwards';
                    }
                });
            });

            document.querySelectorAll('.project-button').forEach(btn => {
                observer.observe(btn);
            });
        });
    </script>
</body>
</html>
