<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSec Password Auditor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --text-primary: #00ff41;
            --text-secondary: #7df9ff;
            --text-muted: #888;
            --accent-red: #ff073a;
            --accent-orange: #ff8800;
            --accent-green: #00ff41;
            --border-color: #333;
            --glow-color: #00ff41;
        }
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 65, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(125, 249, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }
        
        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 1s ease-out;
        }
        
        h1 {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px var(--glow-color));
        }
        
        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 1px;
        }
        
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0, 255, 65, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--glow-color), transparent);
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }
        
        .card:hover::before {
            opacity: 0.3;
        }
        
        .input-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .password-input {
            width: 100%;
            padding: 1rem 3rem 1rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        
        .password-input:focus {
            outline: none;
            border-color: var(--glow-color);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
        }
        
        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .toggle-password:hover {
            color: var(--text-primary);
        }
        
        .strength-meter {
            height: 10px;
            background: var(--bg-tertiary);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        
        .strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .strength-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .strength-text {
            text-align: center;
            font-weight: 700;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .detail-item {
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }
        
        .detail-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .detail-value {
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 500;
        }
        
        .suggestions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .suggestion {
            padding: 0.75rem;
            background: var(--bg-primary);
            border-left: 3px solid var(--accent-orange);
            border-radius: 0 5px 5px 0;
            animation: slideIn 0.5s ease-out;
        }
        
        .suggestion.critical {
            border-left-color: var(--accent-red);
        }
        
        .suggestion.good {
            border-left-color: var(--accent-green);
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover {
            background: var(--bg-secondary);
            border-color: var(--glow-color);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }
        
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }
        
        input[type="range"] {
            width: 100%;
            margin-bottom: 0.5rem;
        }
        
        .checkbox-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        input[type="checkbox"] {
            accent-color: var(--glow-color);
            cursor: pointer;
        }
        
        .generated-password {
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: 5px;
            font-family: 'JetBrains Mono', monospace;
            word-break: break-all;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .card {
                padding: 1.5rem;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>CyberSec Password Auditor</h1>
            <p class="subtitle">Advanced password strength analysis powered by entropy calculations</p>
        </header>

        <div class="card">
            <div class="input-wrapper">
                <input type="password" class="password-input" id="passwordInput" placeholder="Enter password to analyze..." autofocus>
                <button class="toggle-password" id="togglePassword" title="Toggle visibility">👁️</button>
            </div>
            
            <div class="strength-meter">
                <div class="strength-bar" id="strengthBar"></div>
            </div>
            
            <div class="strength-text" id="strengthText">Enter a password to begin analysis</div>
        </div>

        <div class="card" id="detailsCard" style="display: none;">
            <h3 style="margin-bottom: 1rem;">Analysis Details</h3>
            <div class="details-grid">
                <div class="detail-item">
                    <div class="detail-label">Entropy</div>
                    <div class="detail-value" id="entropyValue">- bits</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Character Set</div>
                    <div class="detail-value" id="charsetValue">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Time to Crack</div>
                    <div class="detail-value" id="crackTimeValue">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Length</div>
                    <div class="detail-value" id="lengthValue">- characters</div>
                </div>
            </div>
            
            <h4 style="margin: 1.5rem 0 1rem;">Improvement Suggestions</h4>
            <div class="suggestions" id="suggestions"></div>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="generatePassword()">Generate Secure Password</button>
            <button class="btn" onclick="analyzePassword()">Deep Analysis</button>
            <button class="btn" onclick="copyPassword()">Copy to Clipboard</button>
        </div>
    </div>

    <div class="modal" id="generatorModal">
        <div class="modal-content">
            <button class="close" onclick="closeModal()">&times;</button>
            <h3>Secure Password Generator</h3>
            
            <div class="form-group">
                <label>Length: <span id="lengthDisplay">16</span></label>
                <input type="range" id="lengthSlider" min="8" max="32" value="16" oninput="updateLength()">
            </div>
            
            <div class="checkbox-group">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="includeUppercase" checked>
                    <label for="includeUppercase">Uppercase</label>
                </div>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="includeLowercase" checked>
                    <label for="includeLowercase">Lowercase</label>
                </div>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="includeNumbers" checked>
                    <label for="includeNumbers">Numbers</label>
                </div>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="includeSymbols" checked>
                    <label for="includeSymbols">Symbols</label>
                </div>
            </div>
            
            <button class="btn" onclick="generateNewPassword()">Generate</button>
            
            <div class="generated-password" id="generatedPassword"></div>
            
            <button class="btn" onclick="copyGenerated()">Copy Generated Password</button>
            <button class="btn" onclick="useGenerated()">Use This Password</button>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('passwordInput');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');
        const detailsCard = document.getElementById('detailsCard');
        const togglePassword = document.getElementById('togglePassword');
        
        const commonPasswords = [
            '123456', 'password', '123456789', '12345678', '12345', '1234567', 'qwerty',
            'abc123', 'football', 'monkey', 'letmein', 'dragon', '111111', 'baseball'
        ];
        
        let generated = '';
        
        passwordInput.addEventListener('input', analyzePassword);
        
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            togglePassword.textContent = type === 'password' ? '👁️' : '🔒';
        });
        
        function analyzePassword() {
            const password = passwordInput.value;
            if (!password) {
                detailsCard.style.display = 'none';
                strengthText.textContent = 'Enter a password to begin analysis';
                strengthBar.style.width = '0%';
                strengthBar.style.backgroundColor = '';
                return;
            }
            
            detailsCard.style.display = 'block';
            
            const analysis = calculateStrength(password);
            updateStrengthMeter(analysis);
            updateDetails(analysis);
            updateSuggestions(password, analysis);
        }
        
        function calculateStrength(password) {
            let charsetSize = 0;
            let types = 0;
            
            if (/[a-z]/.test(password)) {
                charsetSize += 26;
                types++;
            }
            if (/[A-Z]/.test(password)) {
                charsetSize += 26;
                types++;
            }
            if (/\d/.test(password)) {
                charsetSize += 10;
                types++;
            }
            if (/[^a-zA-Z0-9]/.test(password)) {
                charsetSize += 32;
                types++;
            }
            
            const entropy = Math.log2(Math.pow(charsetSize, password.length));
            const possibleCombinations = Math.pow(charsetSize, password.length);
            const guessesPerSecond = 1e9;
            const secondsToCrack = possibleCombinations / (2 * guessesPerSecond);
            
            let strength = 'Weak';
            let color = 'var(--accent-red)';
            
            if (entropy > 60) {
                strength = 'Strong';
                color = 'var(--accent-green)';
            } else if (entropy > 40) {
                strength = 'Medium';
                color = 'var(--accent-orange)';
            }
            
            if (commonPasswords.includes(password.toLowerCase())) {
                strength = 'Very Weak';
                color = 'var(--accent-red)';
            }
            
            return {
                entropy: Math.round(entropy * 100) / 100,
                charsetSize,
                types,
                strength,
                color,
                length: password.length,
                crackTime: formatTime(secondsToCrack)
            };
        }
        
        function updateStrengthMeter(analysis) {
            const percentage = Math.min(100, (analysis.entropy / 80) * 100);
            strengthBar.style.width = `${percentage}%`;
            strengthBar.style.backgroundColor = analysis.color;
            strengthText.textContent = `Password Strength: ${analysis.strength}`;
            strengthText.style.color = analysis.color;
        }
        
        function updateDetails(analysis) {
            document.getElementById('entropyValue').textContent = `${analysis.entropy} bits`;
            document.getElementById('charsetValue').textContent = `${analysis.charsetSize} characters`;
            document.getElementById('crackTimeValue').textContent = analysis.crackTime;
            document.getElementById('lengthValue').textContent = `${analysis.length} characters`;
        }
        
        function updateSuggestions(password, analysis) {
            const suggestions = document.getElementById('suggestions');
            suggestions.innerHTML = '';
            
            const checks = [
                { test: password.length < 12, text: 'Use at least 12 characters for better security', type: 'critical' },
                { test: !/[a-z]/.test(password), text: 'Include lowercase letters (a-z)', type: 'critical' },
                { test: !/[A-Z]/.test(password), text: 'Include uppercase letters (A-Z)', type: 'suggestion' },
                { test: !/\d/.test(password), text: 'Include numbers (0-9)', type: 'suggestion' },
                { test: !/[^a-zA-Z0-9]/.test(password), text: 'Include special characters (!@#$%)', type: 'suggestion' },
                { test: commonPasswords.includes(password.toLowerCase()), text: 'Avoid common passwords', type: 'critical' },
                { test: /(.)\1{2,}/.test(password), text: 'Avoid repeated characters', type: 'suggestion' }
            ];
            
            checks.filter(check => check.test).forEach(check => {
                const div = document.createElement('div');
                div.className = `suggestion ${check.type}`;
                div.textContent = check.text;
                suggestions.appendChild(div);
            });
            
            if (checks.filter(c => c.test).length === 0 && analysis.entropy > 50) {
                const div = document.createElement('div');
                div.className = 'suggestion good';
                div.textContent = 'Excellent password! This is a strong password.';
                suggestions.appendChild(div);
            }
        }
        
        function formatTime(seconds) {
            const minute = 60;
            const hour = minute * 60;
            const day = hour * 24;
            const year = day * 365;
            const century = year * 100;
            
            if (seconds < minute) {
                return `${Math.round(seconds)} seconds`;
            } else if (seconds < hour) {
                return `${Math.round(seconds / minute)} minutes`;
            } else if (seconds < day) {
                return `${Math.round(seconds / hour)} hours`;
            } else if (seconds < year) {
                return `${Math.round(seconds / day)} days`;
            } else if (seconds < century) {
                return `${Math.round(seconds / year)} years`;
            } else {
                return 'Centuries';
            }
        }
        
        function generatePassword() {
            document.getElementById('generatorModal').style.display = 'block';
            generateNewPassword();
        }
        
        function closeModal() {
            document.getElementById('generatorModal').style.display = 'none';
        }
        
        function updateLength() {
            const length = document.getElementById('lengthSlider').value;
            document.getElementById('lengthDisplay').textContent = length;
        }
        
        function generateNewPassword() {
            const length = parseInt(document.getElementById('lengthSlider').value);
            const includeUppercase = document.getElementById('includeUppercase').checked;
            const includeLowercase = document.getElementById('includeLowercase').checked;
            const includeNumbers = document.getElementById('includeNumbers').checked;
            const includeSymbols = document.getElementById('includeSymbols').checked;
            
            const chars = [];
            if (includeLowercase) chars.push(...'abcdefghijklmnopqrstuvwxyz');
            if (includeUppercase) chars.push(...'ABCDEFGHIJKLMNOPQRSTUVWXYZ');
            if (includeNumbers) chars.push(...'0123456789');
            if (includeSymbols) chars.push(...'!@#$%^&*()_+-=[]{}|;:,.<>?');
            
            if (chars.length === 0) return;
            
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars[Math.floor(Math.random() * chars.length)];
            }
            
            generated = password;
            document.getElementById('generatedPassword').textContent = password;
        }
        
        function copyGenerated() {
            navigator.clipboard.writeText(generated);
            alert('Password copied to clipboard!');
        }
        
        function useGenerated() {
            passwordInput.value = generated;
            analyzePassword();
            closeModal();
        }
        
        function copyPassword() {
            navigator.clipboard.writeText(passwordInput.value);
            alert('Current password copied to clipboard!');
        }
        
        window.onclick = function(event) {
            if (event.target.className === 'modal') {
                closeModal();
            }
        }
        
        analyzePassword();
    </script>
</body>
</html>
